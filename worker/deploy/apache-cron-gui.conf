# Apache (reverse proxy) para la GUI local del worker en el LXC.
# Instalar en /etc/apache2/sites-available/cron-gui.conf y:
#   a2ensite cron-gui && a2enmod proxy proxy_http && systemctl reload apache2

<VirtualHost *:80>
    ServerName cron-gui.local
    # Escucha solo en la IP interna del LXC (no publicar al mundo)

    ProxyPreserveHost Off
    ProxyRequests Off

    # Estáticos/Dashboard
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    <Proxy *>
        Require all granted
    </Proxy>

    ErrorLog ${APACHE_LOG_DIR}/cron-gui-error.log
    CustomLog ${APACHE_LOG_DIR}/cron-gui-access.log combined
</VirtualHost>
